<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Flow </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Navigation Bar -->
    <nav>

        <h1 class="logo">
            Task <span>Flow</span>
        </h1>
        <div class="links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="content">

        <div class="heading">
            <h2>My Tasks</h2>
            <p>Stay Organized..! Get Things Done</p>
        </div>

        <div class="input">
            <input type="text" placeholder="Add New Task">
            <button>Add Task</button>
        </div>

    </div>

    <!-- Task  Section -->
    <section class="Tasks">
        <h2>Todays Tasks</h2>
        <div class="cards">
            <div class="card">
                <img class="icon" src="html-document.png">
                <input type="checkbox"> Learn HTML & CSS
                <P>HTML & CSS Completed / Done</P>
            </div>
            <div class="card">
                <img class="icon" src="js.png">
                <input type="checkbox"> Learn JavaScript
                <p>Learn JavaScript And Many More
                </p>
            </div>
            <div class="card">
                <img class="icon" src="github.png">
                <input type="checkbox"> Learn GitHub
                <p>Github AND Its Advanced Features</p>
            </div>
        </div>


    </section>

    <footer>
        <h2>Task Flow</h2>
        <p> Stay organized, get things done
            © 2026 TaskFlow
        </p>
    </footer>

</body>

</html>
